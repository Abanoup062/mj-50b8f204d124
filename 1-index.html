function partnersTbl(c){

function viewSum(){
  let h='<h2>الملخص</h2>';
  h+=note('كل الأرقام بتتحسب من نفس معادلات الشيت. غيّر أي رقم في أي تاب وهتتحدث كل الأرقام هنا. التعديلات مؤقتة وبتتحفظ في المتصفح بس لحد ما تقرر ترفع.');

  h+=box('المشاريع (إجمالي لحساب الناس)',cards([['الانتر',S.IN,'G31'],['الذهبية كمال',S.GK,'G46'],['ذهبية 1200',S.G12,'G52'],['مجاويش',S.MJ,'G42']]));
  h+=box('مجاويش',cards([[ownerRule?'إجمالي المدفوع (شامل رأس مالك)':'دفعه الشركاء فعلاً',S.MJ,'C16'],['مصاريف انت دافعها',S.MJ,'K38'],['الواصل من المبيعات',S.MJ,'J37'],['الإجمالي المنسوب للشركاء',S.MJ,'H16']]));
  h+=box('أخرى',cards([['المحفظة العامة',S.W,'D120']]));

const NOTES=[
 ['تم الحسم','قرارك: انت شريك في مجاويش برأس مال = مصاريفك (571,140، رقم افتتاحي ثابت في خانة C10 مش مربوط بإجمالي المصاريف). النسب بقت على 6,391,140 (5,820,000 + 571,140). ده مش في الشيت الأصلي، وفيه مفتاح فوق ترجع بيه لقاعدة الشيت. الأثر: أنصبة الشركاء قلّت، وعمود مجاويش في العهدة وتقسيم الناس اتغير، وفرق العهدة K29 بقى -571,140 (محتاج قرار).'],
 ['للتوضيح (قاعدة الشيت الأصلية)','مصاريف مجاويش 571,140 دفعتها انت من جيبك وهترجع بعد البيع والربح. "المدفوع من طرفه" = اللي الشريك دفعه + حصته من المصاريف اللي انت دافعها. الشيت سليم، غيّرت التسميات بس. مثال: مينا 2,300,000 + 225,708 = 2,525,708.'],
 ['اتأكدت','تقسيم فلوس الناس والعهدة الأم بيستخدموا "المنسوب له" (H) في عمود مجاويش والمنصرف، يعني حصة المصاريف بتتخصم من مستحقات الشريك. ده متسق مع التفسير ومفيش معادلة بتعامله بشكل مختلف.'],
 ['انتبه','الانتر والذهبية كمال: المعادلة بتخصم ثلث المصاريف بس (عمود L = K ÷ 3) مش كل المصاريف. ذهبية 1200 ومجاويش بيخصموا كل المصاريف.'],
 ['انتبه','مجاويش: بند "مصاريف قديمة" 248,640 مكتوب كرقم ثابت، وبنوده التفصيلية (حفر إسلام + غرامة تليفونات) في خانات تانية مجموعها نفس الرقم لكن بدون ربط. لو غيرت واحد لازم تغير التاني.'],

];
function viewNotes(){
  let h='<h2>ملاحظات وأسئلة</h2>';
  h+=NOTES.map(([k,t])=>`<div class="note ${k==='انتبه'?'':'ok'}"><b>${k}:</b> ${t}</div>`).join('');

function viewRecon(){
  let n=0,same=0,diff=[];
  for(const sh in CELLS)for(const a in CELLS[sh]){const c=CELLS[sh][a];if(c.f===undefined)continue;n++;
    let v=m.get(sh,a);let e=c.c;if(v instanceof Err)v=v.code;
    const ok=(typeof v==='number'&&typeof e==='number')?Math.abs(v-e)<=1e-6*Math.max(1,Math.abs(e)):((v===null?0:v)===(e===null||e===undefined?0:e));
    if(ok)same++;else diff.push([sh,a,c.f,v,e])}
  const edits=editCount();
  const bySh={};diff.forEach(d=>bySh[d[0]]=(bySh[d[0]]||0)+1);
  let h='<h2>مطابقة مع الشيت</h2>';
  if(ownerRule)h+=`<div class="note"><b>القاعدة الجديدة مفعّلة (قرارك، مش معادلة في الشيت):</b> الاختلافات اللي تحت سببها إضافة صفك كشريك في مجاويش برأس مال ${fmt(m.get(S.MJ,'C10'))} (رقم افتتاحي ثابت في C10، مش مربوط بإجمالي المصاريف K38 اللي حاليا ${fmt(m.get(S.MJ,'K38'))}. أي مصروف جديد مش بيغير نسب الملكية). عشان تشوف تطابق الشيت الأصلي بالكامل اختار "قاعدة الشيت الأصلية" من القايمة فوق. الخانات المختلفة حسب الورقة: ${Object.entries(bySh).map(([k,v])=>esc(k.trim())+' ('+v+')').join('، ')||'لا شيء'}.</div>`;
  h+=`<div class="note ${diff.length&&!edits&&!ownerRule?'':'ok'}">اتحسبت <b>${n}</b> معادلة في الشيت. متطابقة مع القيم الأصلية: <b>${same}</b>. مختلفة: <b>${diff.length}</b>. تعديلاتك الحالية: <b>${edits}</b> خانة.${ownerRule?' (الاختلاف سببه القاعدة الجديدة.)':edits?' الاختلاف طبيعي لأنك غيرت أرقام.':' لا توجد تعديلات: المفروض الاختلاف صفر.'}</div>`;
  h+=note('اتأكدت كمان بإعادة حساب الشيت الأصلي في LibreOffice بعد تغيير أرقام في الأوراق، والموقع طلع نفس النتائج في كل المعادلات (بسيناريوهات متعددة).','ok');
  const heads=[['إجمالي المدفوع (مجاويش C16)',S.MJ,'C16',5820000],['إجمالي المصاريف (K38)',S.MJ,'K38',571140],['الصافي (G42)',S.MJ,'G42',-571140],['المنسوب للشركاء (H16)',S.MJ,'H16',6391140],['ذهبية 1200: المنسوب (H21)',S.G12,'H21',16452500],['الانتر: إجمالي لحساب الناس',S.IN,'G31',12607000],['الذهبية كمال: إجمالي لحساب الناس',S.GK,'G46',27450000],['العهدة الأم: إجمالي المستحق',S.AM,'B43',31416440],['العهدة الأم: المتبقي',S.AM,'H29',8572800],['المحفظة العامة D120',S.W,'D120',8465720]];
  h+=tbl(['الخانة','الشيت','الموقع',''],heads.map(([l,s,a,ref])=>{const v=nv(s,a);const e=ref===null?m.cell(s,a).c:ref;return `<tr><td>${l}</td><td class="n">${fmt(e)}</td><td class="n">${fmt(v)}</td><td>${Math.abs(v-e)<1?'✔ متطابق':(edits?'اتغيّر بتعديلك':'❌ فرق')}</td></tr>`}));
  const cmp=[['مجاويش: إجمالي المدفوع C16',S.MJ,'C16'],['مجاويش: نسبة مينا D6 (%)',S.MJ,'D6'],['مجاويش: نصيب مينا F6',S.MJ,'F6'],['مجاويش: المنسوب لمينا H6',S.MJ,'H6'],['مجاويش: المنسوب لميشيل H7',S.MJ,'H7'],['مجاويش: المنسوب لاسعد H8',S.MJ,'H8'],['مجاويش: المنسوب لكرم H9',S.MJ,'H9'],['مجاويش: صفك انت H10',S.MJ,'H10'],['مجاويش: إجمالي الربح/الخسارة G16',S.MJ,'G16'],['مجاويش: إجمالي المنسوب H16',S.MJ,'H16'],['العهدة: منصرف مجاويش D7',S.AM,'D7'],['العهدة: إجمالي المنصرف D30',S.AM,'D30'],['العهدة: المتبقي H29',S.AM,'H29'],['العهدة: الفرق K29',S.AM,'K29'],['تقسيم الناس: مجاويش G39',S.PP,'G39'],['تقسيم الناس: الباقي لكرم N17',S.PP,'N17'],['تقسيم الناس: الباقي لمينا N19',S.PP,'N19'],['تقسيم الناس: الباقي الإجمالي N39',S.PP,'N39'],['تقسيم الناس: فرق مع العهدة N40',S.PP,'N40']];
  h+='<h2>قاعدة الشيت الأصلية مقابل القاعدة الجديدة</h2>'+tbl(['الخانة','الشيت الأصلي','الموقع دلوقتي','سبب الفرق'],cmp.map(([l,sh,a])=>{const c=CELLS[sh][a];const e=c&&c.c!==undefined?c.c:(c?c.v:0);const v=nv(sh,a);const same=Math.abs((+v||0)-(+e||0))<1e-6;return `<tr><td>${l}</td><td class="n">${fmt(e,a[0]==='D'&&sh===S.MJ?2:0)}</td><td class="n">${fmt(v,a[0]==='D'&&sh===S.MJ?2:0)}</td><td>${same?'—':(ownerRule?'قاعدتك الجديدة (انت شريك برأس مال المصاريف)':'تعديلك')}</td></tr>`}));
  if(diff.length&&!edits&&!ownerRule)h+=`<pre>${esc(JSON.stringify(diff.slice(0,10)))}</pre>`;
  return h}

const TABS=[['الملخص',viewSum],['العهدة الأم',viewAM],['تقسيم فلوس الناس',viewPP],['مجاويش',()=>pjView('MJ')],['ذهبية 1200',()=>pjView('G12')],['الذهبية كمال',()=>pjView('GK')],['الانتر',()=>pjView('IN')],['المحفظة العامة',viewW],['ملاحظات',viewNotes],['مطابقة',viewRecon]];
document.getElementById('nav').innerHTML=TABS.map((t,i)=>`<button id="b${i}" onclick="show(${i})">${t[0]}</button>`).join('');
function show(i){cur=i;location.hash=i;render()}
function render(){
  const y=window.scrollY;
  const mx=document.getElementById('main');
  mx.innerHTML=TABS[cur][1]();
  TABS.forEach((_,k)=>document.getElementById('b'+k).classList.toggle('on',k===cur));
  document.getElementById('edits').textContent=editCount();document.getElementById('rulesel').value=ownerRule?'1':'0';
  window.scrollTo(0,y)}
function rerenderKeep(){const a=document.activeElement;const id=a&&a.tagName==='INPUT'&&!a.dataset.a?a.value:null;render();if(id!==null){const i=document.querySelector('#main input.t:not([data-a])');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.f!==undefined)t.value=t.dataset.f});
document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.f!==undefined&&t.value===t.dataset.f)t.value=t.dataset.v});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.a)return;
  if(t.dataset.f!==undefined&&t.value===t.dataset.f)return;
  m.setOv(t.dataset.s,t.dataset.a,t.value);save();render()});
function toggleAll(c){showAll=c;render()}
function exportJ(){const b=new Blob([JSON.stringify({version:2,note:'majawish preview edits',rule:ownerRule,ov:m.ov},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='majawish-edits.json';a.click()}
function importJ(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);m.ov={};m.cache={};Object.assign(m.ov,o.ov||{});if(typeof o.rule==='boolean')ownerRule=o.rule;applyRule();save();render()}catch(x){alert('الملف مش صالح')}};r.readAsText(f)}
function resetAll(){if(confirm('ترجع كل الأرقام لقيم الشيت الأصلية؟')){m.ov={};m.cache={};applyRule();save();render()}}
if(location.hash&&+location.hash.slice(1)<TABS.length)cur=+location.hash.slice(1);
applyRule();render();
